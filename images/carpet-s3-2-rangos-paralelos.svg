<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 212" role="img" aria-label="Un grupo de filas con cinco bloques de columna. Solo los bloques A, C y E se necesitan y se descargan con tres peticiones por rango simultáneas hacia el lector." font-family="'IBM Plex Sans', system-ui, sans-serif">
