<rect x="590" y="22" width="12" height="12" rx="2" fill="#1E4FD8"></rect><text x="610" y="33" font-size="12">se lee</text>
<rect x="590" y="42" width="12" height="12" rx="2" fill="#E3E8EF"></rect><text x="610" y="53" font-size="12">se omite</text>
<g font-family="'IBM Plex Mono', monospace" font-size="12" fill="#1E4FD8">
