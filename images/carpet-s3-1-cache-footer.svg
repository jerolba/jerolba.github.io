<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 172" role="img" aria-label="Archivo Parquet en S3 con varios grupos de filas y un footer al final. Una única petición de los últimos 8 MiB lleva el footer con los metadatos al lector." font-family="'IBM Plex Sans', system-ui, sans-serif">
<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B6E6E"></path></marker></defs>
<g font-size="13" fill="#3D4C62">
<text x="20" y="30" font-weight="600" fill="#0E1A2B">Archivo .parquet en S3</text>
<rect x="20" y="52" width="110" height="56" rx="6" fill="#E3E8EF"></rect><text x="75" y="85" text-anchor="middle">Grupo 1</text>
<rect x="134" y="52" width="110" height="56" rx="6" fill="#E3E8EF"></rect><text x="189" y="85" text-anchor="middle">Grupo 2</text>
<rect x="248" y="52" width="110" height="56" rx="6" fill="#E3E8EF"></rect><text x="303" y="85" text-anchor="middle">Grupo 3</text>
<text x="384" y="85" text-anchor="middle" font-size="18">···</text>
<rect x="410" y="52" width="110" height="56" rx="6" fill="#E3E8EF"></rect><text x="465" y="85" text-anchor="middle">Grupo N</text>
<rect x="524" y="52" width="80" height="56" rx="6" fill="#0B6E6E"></rect><text x="564" y="85" text-anchor="middle" fill="#FFFFFF" font-weight="600">footer</text>
<rect x="462" y="44" width="148" height="72" rx="8" fill="none" stroke="#0B6E6E" stroke-width="2" stroke-dasharray="6 4"></rect>
<text x="536" y="140" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#0B6E6E">últimos 8 MiB</text>
<line x1="614" y1="80" x2="684" y2="80" stroke="#0B6E6E" stroke-width="2.5" marker-end="url(#m1)"></line>
<text x="649" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6E6E">1 petición</text>
<rect x="690" y="44" width="84" height="72" rx="8" fill="#0E1A2B"></rect>
<text x="732" y="74" text-anchor="middle" fill="#FFFFFF" font-weight="600">Lector</text>
<text x="732" y="92" text-anchor="middle" fill="#FFFFFF" font-size="12">metadatos</text>
</g>
</svg>
